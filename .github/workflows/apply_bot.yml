name: Naukri Automation Pipeline

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST
    - cron: '30 5 * * *'  # 11:00 AM IST
    - cron: '30 9 * * *'  # 3:00 PM IST
    - cron: '30 12 * * *' # 6:00 PM IST
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: read

concurrency:
  group: naukri-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore Naukri Session
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
        run: |
          if [ -n "$NAUKRI_STORAGE_STATE" ]; then
            printf '%s' "$NAUKRI_STORAGE_STATE" | base64 -d > auth_state.json
            echo "Restored auth_state.json from NAUKRI_STORAGE_STATE"
          else
            echo "No NAUKRI_STORAGE_STATE secret; will use NAUKRI_COOKIES if provided."
          fi

      - name: Validate Setup
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py --self-check

      - name: Execute Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          # Headless Chromium is often 403'd by Naukri's WAF. Running "headful"
          # inside a virtual display keeps the normal browser fingerprint.
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python main.py --headful --log-level INFO
          else
            python main.py --log-level INFO
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-run-${{ github.run_id }}
          path: |
            reports/
            logs/
          if-no-files-found: ignore
          retention-days: 14
