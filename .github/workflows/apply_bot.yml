name: Naukri Automation Pipeline

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST
    - cron: '30 5 * * *'  # 11:00 AM IST
    - cron: '30 9 * * *'  # 3:00 PM IST
    - cron: '30 12 * * *' # 6:00 PM IST
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: read

concurrency:
  group: naukri-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Restore Naukri Session
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          import pathlib

          raw = os.environ.get("NAUKRI_STORAGE_STATE", "").strip()
          cookies_raw = os.environ.get("NAUKRI_COOKIES", "").strip()

          if raw:
              if raw.startswith("{"):
                  decoded = raw.encode()
              else:
                  decoded = base64.b64decode(raw)
              try:
                  decoded = gzip.decompress(decoded)
              except OSError:
                  pass
              state = json.loads(decoded)
              cookies = state.get("cookies") or []
              if not cookies:
                  raise SystemExit("NAUKRI_STORAGE_STATE decoded but contains no cookies")
              pathlib.Path("auth_state.json").write_text(json.dumps(state), encoding="utf-8")
              print(f"Restored {len(cookies)} cookie(s) to auth_state.json")
          elif cookies_raw:
              data = json.loads(cookies_raw)
              cookies = data if isinstance(data, list) else data.get("cookies", [])
              if not cookies:
                  raise SystemExit("NAUKRI_COOKIES contains no cookies")
              print(f"Using {len(cookies)} cookie(s) from NAUKRI_COOKIES")
          else:
              raise SystemExit(
                  "No Naukri session supplied. Set NAUKRI_STORAGE_STATE to "
                  "`gzip -9 -c auth_state.json | base64 -w 0` (under 48 KB), "
                  "or set NAUKRI_COOKIES to the cookies JSON array."
              )
          PY

      - name: Validate Setup
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py --self-check

      - name: Execute Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          # Headless Chromium is often 403'd by Naukri's WAF. Running "headful"
          # inside a virtual display keeps the normal browser fingerprint.
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python main.py --headful --log-level INFO
          else
            python main.py --log-level INFO
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-run-${{ github.run_id }}
          path: |
            reports/
            logs/
          if-no-files-found: ignore
          retention-days: 14
